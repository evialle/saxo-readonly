[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saxo-readonly"
version = "0.1.0"
description = "Independent read-only Saxo OpenAPI connector with optional OpenClaw integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "evialle and contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/evialle/saxo-readonly"
Issues = "https://github.com/evialle/saxo-readonly/issues"

[project.scripts]
saxo-readonly = "saxo_readonly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
